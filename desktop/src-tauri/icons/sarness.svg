<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1a25"/>
      <stop offset="1" stop-color="#0b0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strap" x1="0.25" y1="0.1" x2="0.75" y2="0.95">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#glow)"/>
  <rect x="66" y="66" width="892" height="892" rx="210" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- the harness strap -->
  <path d="M640 290 A148 148 0 1 0 512 512 A148 148 0 1 1 384 734" fill="none"
        stroke="#000" stroke-opacity="0.35" stroke-width="96" stroke-linecap="round" transform="translate(0 14)"/>
  <path d="M640 290 A148 148 0 1 0 512 512 A148 148 0 1 1 384 734" fill="none"
        stroke="url(#strap)" stroke-width="88" stroke-linecap="round"/>
  <!-- workflow nodes at the strap ends -->
  <circle cx="640" cy="290" r="30" fill="#f5f3ff"/>
  <circle cx="384" cy="734" r="30" fill="#f5f3ff"/>
  <circle cx="640" cy="290" r="13" fill="#7c3aed"/>
  <circle cx="384" cy="734" r="13" fill="#7c3aed"/>
</svg>
